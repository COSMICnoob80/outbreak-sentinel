# City-scoped Google News queries for the non-bio verticals.
wildfire_query: "wildfire OR bushfire"
supply_chain_query: "medicine shortage OR drug shortage OR medical supply chain"

# Diseases to track
diseases:
  - dengue
  - malaria
  - cholera
  - typhoid
  - hepatitis
  - measles
  - pertussis
  - mpox

# News search keywords (fetched via Google News RSS)
news_keywords:
  - "dengue outbreak"
  - "malaria cases"
  - "cholera"
  - "typhoid"
  - "hepatitis"
  - "fever outbreak"
  - "hospital patients"
  - "measles outbreak"
  - "pertussis outbreak"
  - "mpox cases"

# Social/sentiment keywords (fetched via Google News RSS as proxy)
social_keywords:
  - "dengue symptoms"
  - "malaria symptoms"
  - "fever"
  - "sick"
  - "hospital overflow"
  - "patients"
  - "whooping cough"

# Topic vocabulary per disease. A headline is evidence for a card only when it
# names the city AND contains one of these terms for the queried disease.
# Keeping this here means tuned wording never hides inside a scoring function.
topic_terms:
  dengue:
    - dengue
    - "dengue fever"
    - aedes
    - mosquito
    - outbreak
    - vector
    - cases
    - hospitalised
    - hospitalized
  malaria:
    - malaria
    - plasmodium
    - anopheles
    - mosquito
    - outbreak
    - cases
    - fever
    - hospitalised
    - hospitalized
  cholera:
    - cholera
    - vibrio
    - diarrhoea
    - diarrhea
    - waterborne
    - outbreak
    - cases
    - hospitalised
    - hospitalized
  typhoid:
    - typhoid
    - "enteric fever"
    - salmonella
    - outbreak
    - cases
    - fever
    - hospitalised
    - hospitalized
  hepatitis:
    - hepatitis
    - jaundice
    - liver
    - outbreak
    - cases
    - hospitalised
    - hospitalized
  measles:
    - measles
    - rubeola
    - outbreak
    - cases
    - vaccination
    - vaccine
    - hospitalised
    - hospitalized
  pertussis:
    - pertussis
    - "whooping cough"
    - cough
    - outbreak
    - cases
    - vaccination
    - vaccine
    - hospitalised
    - hospitalized
  mpox:
    - mpox
    - monkeypox
    - outbreak
    - cases
    - clade
    - hospitalised
    - hospitalized
  default:
    - outbreak
    - cases
    - fever
    - infection
    - disease
    - hospitalised
    - hospitalized

# Evidence vocabulary — the ONLY vocabulary that makes a headline evidence for a
# card. Generic outbreak words (outbreak, cases, hospitalised, vaccine) live in
# topic_terms above and are deliberately not accepted here: they say an outbreak
# happened, never which disease it was. A headline about a different disease
# (ebola, legionnaires, covid) is never evidence for a dengue card.
evidence_terms:
  dengue:
    - dengue
  malaria:
    - malaria
    - plasmodium
  cholera:
    - cholera
  typhoid:
    - typhoid
    - enteric fever
  hepatitis:
    - hepatitis
  measles:
    - measles
    - rubeola
  pertussis:
    - pertussis
    - whooping cough
  mpox:
    - mpox
    - monkeypox

# Vector families. A headline already tagged to the city counts when it names
# the vector, even without the disease name. Water/sanitation is NOT a vector
# family: a cholera or typhoid card still requires the disease word itself.
vector_terms:
  dengue:
    - mosquito
    - mosquitoes
    - aedes
  malaria:
    - mosquito
    - mosquitoes
    - anopheles

# Risk thresholds for rule-based scoring (used as fallback)
thresholds:
  # Score credit per city-specific report count, measured over
  # city_lookback_hours (7 days) — not the shared 24h news pool. The densest
  # band whose min_reports is met wins, so 0 reports scores 0. Order here does
  # not matter; the code sorts by min_reports.
  evidence_density:
    - min_reports: 5
      points: 55
    - min_reports: 3
      points: 40
    - min_reports: 2
      points: 30
    - min_reports: 1
      points: 20
  sentiment_high: 0.6  # 0-1 panic score
  sentiment_medium: 0.3
  temp_high: 35.0      # °C
  rain_high: 50.0      # mm

# Narrator (prose-only layer over deterministic cards)
narrator:
  # Reasoning models spend tokens on reasoning before writing content, so this
  # cap must clear both. hy4-flash's reasoning phase varies by prompt: 900,
  # 1200 and 2000 still returned empty content on live Karachi calls; 2600 did.
  # 3000 adds margin — billed tokens are the reported total, not the cap.
  # A reasoning model needs a high ceiling; a non-reasoning model answers far below it.
  max_tokens: 3000

# Groq LLM settings
groq:
  model: "openai/gpt-oss-120b"
  api_key_env: "GROQ_API_KEY"   # Name of env var holding the API key

# Lookback window in hours (shared diagnostic pool)
lookback_hours: 24

# Wider window used ONLY for per-city news queries (7 days), so real city
# stories are not cut off while the shared pool stays at 24h.
city_lookback_hours: 168
