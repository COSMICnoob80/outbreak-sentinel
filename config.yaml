# Outbreak Sentinel Configuration

# Cities to monitor — two tiers: Pakistan grid, then global reference cities.
# "region" propagates onto every /risk card.
cities:
  - name: Karachi
    lat: 24.8607
    lon: 67.0011
    region: pakistan
  - name: Lahore
    lat: 31.5204
    lon: 74.3587
    region: pakistan
  - name: Islamabad
    lat: 33.6844
    lon: 73.0479
    region: pakistan
  - name: Peshawar
    lat: 34.0151
    lon: 71.5249
    region: pakistan
  - name: Quetta
    lat: 30.1798
    lon: 66.9750
    region: pakistan
  - name: Ludhiana
    lat: 30.9010
    lon: 75.8573
    region: global
  - name: Amritsar
    lat: 31.6340
    lon: 74.8723
    region: global
  - name: Columbia
    lat: 34.0007
    lon: -81.0348
    region: global
  - name: Anchorage
    lat: 61.2181
    lon: -149.9003
    region: global
  - name: Amsterdam
    lat: 52.3676
    lon: 4.9041
    region: global

# Diseases to track
diseases:
  - dengue
  - malaria
  - cholera
  - typhoid
  - hepatitis
  - measles
  - pertussis
  - mpox

# News search keywords (fetched via Google News RSS)
news_keywords:
  - "dengue outbreak"
  - "malaria cases"
  - "cholera"
  - "typhoid"
  - "hepatitis"
  - "fever outbreak"
  - "hospital patients"
  - "measles outbreak"
  - "pertussis outbreak"
  - "mpox cases"

# Social/sentiment keywords (fetched via Google News RSS as proxy)
social_keywords:
  - "dengue symptoms"
  - "malaria symptoms"
  - "fever"
  - "sick"
  - "hospital overflow"
  - "patients"
  - "whooping cough"

# Risk thresholds for rule-based scoring (used as fallback)
thresholds:
  news_high: 10        # articles in lookback window
  news_medium: 5
  sentiment_high: 0.6  # 0-1 panic score
  sentiment_medium: 0.3
  temp_high: 35.0      # °C
  rain_high: 50.0      # mm

# Groq LLM settings
groq:
  model: "openai/gpt-oss-120b"
  api_key_env: "GROQ_API_KEY"   # Name of env var holding the API key

# Lookback window in hours
lookback_hours: 24
